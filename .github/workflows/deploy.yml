name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one that's still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Work out the base path
        # Project sites live at https://<user>.github.io/<repo>/ so every URL needs the "/<repo>" prefix.
        # A user/organisation site (repo named <user>.github.io) is served from the root, so no prefix.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV" ;;
            *)           echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV" ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build static site (next build → ./out)
        run: npm run build

      - name: Upload the ./out folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
